<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><title>Graham's Chores</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033;margin:0}.w{max-width:820px;margin:auto;padding:18px 16px 90px}.card{background:#fff;border-radius:20px;padding:16px;margin:14px 0;box-shadow:0 6px 22px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat b{display:block;font-size:26px;color:#17844b}.job{display:flex;align-items:center;gap:10px;padding:13px 0;border-top:1px solid #e7e9ef}.job:first-child{border:0}.grow{flex:1}.btn{border:0;border-radius:13px;padding:10px 13px;font-weight:700;background:#202a44;color:#fff}.sec{background:#edf0f5;color:#202a44}.good{background:#17844b}.danger{background:#fde8e8;color:#982121}.hidden{display:none}.tabs{display:flex;gap:7px;overflow:auto}.tabs button{white-space:nowrap}input,select{width:100%;padding:11px;border:1px solid #d8dde6;border-radius:11px;box-sizing:border-box;margin:5px 0 10px}label{font-weight:700}.pill{font-size:12px;font-weight:700;background:#fff3d9;color:#805000;padding:7px 9px;border-radius:99px}.done{background:#e4f5eb;color:#126b3d}.small{color:#697386;font-size:13px}.login{max-width:460px;margin:50px auto}.row{display:flex;gap:8px;align-items:center}.money{color:#17844b;font-weight:800}@media(max-width:520px){.w{padding-top:8px}}</style></head><body><main class="w">
<section id="login" class="login"><div class="card"><h1>⭐ Graham's Chores</h1><p class="small">Sign in once on this device.</p><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button class="btn" style="width:100%" onclick="doLogin()">Sign In</button><p id="msg" class="small"></p></div></section>
<section id="kid" class="hidden"><h1>⭐ My Jobs</h1><div class="grid"><div class="card stat">This Week<b id="kw">$0.00</b></div><div class="card stat">My Money<b id="kb">$0.00</b></div></div><div id="goal" class="card hidden"></div><div class="card"><h2>🏠 My Responsibilities</h2><div id="resps"></div></div><div class="card"><h2>💰 My Money Jobs</h2><div id="jobs"></div></div><button class="btn sec" onclick="doLogout()">Sign Out</button></section>
<section id="parent" class="hidden"><h1>Parent Dashboard</h1><p class="small">Changes sync automatically to Graham's iPad.</p><div class="grid"><div class="card stat">This Week<b id="pw">$0.00</b></div><div class="card stat">Balance<b id="pb">$0.00</b></div></div><div class="tabs"><button class="btn" onclick="tab('ap')">Approvals</button><button class="btn sec" onclick="tab('wk')">This Week</button><button class="btn sec" onclick="tab('lib')">Job Library</button><button class="btn sec" onclick="tab('mon')">Money</button><button class="btn sec" onclick="tab('hist')">History</button></div><div id="ap" class="card"></div><div id="wk" class="card hidden"></div><div id="lib" class="card hidden"></div><div id="mon" class="card hidden"></div><div id="hist" class="card hidden"></div><button class="btn sec" onclick="doLogout()">Sign Out</button></section>
</main><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";import{getFirestore,doc,getDoc,setDoc,updateDoc,collection,addDoc,deleteDoc,onSnapshot,serverTimestamp,increment,writeBatch}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyD3oGLEWtFHhmuHirOL8jxjqhjYx-rcWMU",authDomain:"grahams-chores.firebaseapp.com",projectId:"grahams-chores",storageBucket:"grahams-chores.firebasestorage.app",messagingSenderId:"634924367252",appId:"1:634924367252:web:028a2463bfb3f7e529a381"};const PARENT_UID="aDP5yAdPbpQ0QlSCjLNJW7AkV0t1";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);setPersistence(auth,browserLocalPersistence);let u,S={weekEarned:0,balance:0,goal:{}},J=[],L=[],R=[],Q=[],H=[],T=[];const $=x=>document.getElementById(x),m=n=>'$'+Number(n||0).toFixed(2),show=x=>['login','kid','parent'].forEach(y=>$(y).classList.toggle('hidden',y!=x));
window.doLogin=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){$('msg').textContent='Sign-in failed. Check email and password.'}};window.doLogout=()=>signOut(auth);
onAuthStateChanged(auth,async x=>{u=x;if(!u)return show('login');if(u.uid===PARENT_UID){show('parent');await seed();listen(true)}else{show('kid');listen(false)}});
async function seed(){let s=doc(db,'app','state');if((await getDoc(s)).exists())return;await setDoc(s,{weekEarned:0,balance:0,goal:{name:'',amount:0}});for(let x of[['🛏️','Make my bed'],['🧸','Pick up my toys'],['👕','Clothes in hamper'],['🍽️','Clear my dishes']])await addDoc(collection(db,'responsibilities'),{icon:x[0],name:x[1]});for(let x of[['🗑️','Empty trash',.5],['🧺','Put away laundry',.5],['🧹','Vacuum an area',.75],['🚗','Help clean the car',1],['🌳','Help with yard work',1.5],['🍽️','Help with dishwasher',.5]])await addDoc(collection(db,'library'),{icon:x[0],name:x[1],value:x[2]})}
function listen(p){onSnapshot(doc(db,'app','state'),x=>{if(x.exists())S=x.data();render(p)});for(let [c,k]of[['weekJobs','J'],['library','L'],['responsibilities','R'],['submissions','Q'],['history','H'],['transactions','T']])onSnapshot(collection(db,c),x=>{let a=x.docs.map(d=>({id:d.id,...d.data()}));if(k==='J')J=a;if(k==='L')L=a;if(k==='R')R=a;if(k==='Q')Q=a;if(k==='H')H=a;if(k==='T')T=a;render(p)})}
function render(p){if(!p){$('kw').textContent=m(S.weekEarned);$('kb').textContent=m(S.balance);if(S.goal?.name){$('goal').classList.remove('hidden');$('goal').innerHTML='<h2>🎯 Saving for '+S.goal.name+'</h2><b>'+m(S.balance)+' of '+m(S.goal.amount)+'</b>'}else $('goal').classList.add('hidden');$('resps').innerHTML=R.map(x=>jobHTML(x,'responsibility')).join('')||'No responsibilities.';$('jobs').innerHTML=J.map(x=>jobHTML(x,'moneyJob')).join('')||'No money jobs assigned.';return}renderParent()}
function jobHTML(x,type){let q=Q.find(a=>a.jobId===x.id&&a.type===type);return `<div class="job"><span style="font-size:28px">${x.icon}</span><div class="grow"><b>${x.name}</b>${type==='moneyJob'?'<div class="money">'+m(x.value)+'</div>':''}</div>${x.approved?'<span class="pill done">Approved ✓</span>':q?'<span class="pill">Waiting 👍</span>':`<button class="btn ${type==='moneyJob'?'good':'sec'}" onclick="submit('${x.id}','${type}')">DONE ✓</button>`}</div>`}
window.submit=async(id,type)=>{let x=(type==='moneyJob'?J:R).find(a=>a.id===id);await addDoc(collection(db,'submissions'),{jobId:id,jobName:x.name,value:type==='moneyJob'?Number(x.value):0,type,submittedBy:u.uid,submittedAt:serverTimestamp()})};
function renderParent(){$('pw').textContent=m(S.weekEarned);$('pb').textContent=m(S.balance);$('ap').innerHTML='<h2>👍 Approvals</h2>'+(Q.map(x=>`<div class="job"><div class="grow"><b>${x.jobName}</b><div class="small">${x.type==='moneyJob'?m(x.value):'Responsibility'}</div></div><button class="btn good" onclick="approve('${x.id}')">Approve</button><button class="btn danger" onclick="reject('${x.id}')">No</button></div>`).join('')||'Nothing waiting.');
$('wk').innerHTML=`<h2>📅 This Week</h2><select id="sel">${L.map(x=>`<option value="${x.id}">${x.icon} ${x.name} — ${m(x.value)}</option>`).join('')}</select><button class="btn" onclick="addWeek()">+ Add Job</button>${J.map(x=>`<div class="job"><div class="grow">${x.icon} <b>${x.name}</b> ${m(x.value)}</div><button class="btn danger" onclick="removeWeek('${x.id}')">Remove</button></div>`).join('')}<button class="btn sec" style="margin-top:12px" onclick="newWeek()">Start New Week</button>`;
$('lib').innerHTML=`<h2>🧰 Job Library</h2>${L.map(x=>`<div class="job"><div class="grow">${x.icon} <b>${x.name}</b> ${m(x.value)}</div><button class="btn danger" onclick="delLib('${x.id}')">Delete</button></div>`).join('')}<h3>Add Job</h3><input id="ni" value="⭐"><input id="nn" placeholder="Job name"><input id="nv" type="number" step=".25" value=".50"><button class="btn" onclick="addLib()">Save Job</button><h3>Responsibilities</h3>${R.map(x=>`<div class="job"><div class="grow">${x.icon} <b>${x.name}</b></div><button class="btn danger" onclick="delResp('${x.id}')">Delete</button></div>`).join('')}<input id="ri" value="⭐"><input id="rn" placeholder="New responsibility"><button class="btn sec" onclick="addResp()">Add Responsibility</button>`;
$('mon').innerHTML=`<h2>💵 Money</h2><label>Saving for</label><input id="gn" value="${S.goal?.name||''}"><label>Goal amount</label><input id="ga" type="number" value="${S.goal?.amount||''}"><button class="btn" onclick="goalSave()">Save Goal</button><h3>Record Spending</h3><input id="sn" placeholder="What did he buy?"><input id="sa" type="number" step=".01" placeholder="Amount"><button class="btn sec" onclick="spend()">Record Purchase</button>`;
$('hist').innerHTML='<h2>📚 History</h2><h3>Weekly Earnings</h3>'+H.map(x=>`<div class="job"><div class="grow">${x.label}</div><b>${m(x.earned)}</b></div>`).join('')+'<h3>Money Activity</h3>'+T.map(x=>`<div class="job"><div class="grow">${x.note}</div><b>${x.amount>=0?'+':''}${m(x.amount)}</b></div>`).join('')}
window.tab=n=>['ap','wk','lib','mon','hist'].forEach(x=>$(x).classList.toggle('hidden',x!==n));
window.approve=async id=>{let x=Q.find(a=>a.id===id),b=writeBatch(db);if(x.type==='moneyJob'){b.update(doc(db,'weekJobs',x.jobId),{approved:true});b.update(doc(db,'app','state'),{weekEarned:increment(Number(x.value)),balance:increment(Number(x.value))});b.set(doc(collection(db,'transactions')),{note:'Earned: '+x.jobName,amount:Number(x.value),createdAt:serverTimestamp()})}b.delete(doc(db,'submissions',id));await b.commit()};window.reject=id=>deleteDoc(doc(db,'submissions',id));
window.addWeek=async()=>{let x=L.find(a=>a.id===$('sel').value);if(x)await addDoc(collection(db,'weekJobs'),{icon:x.icon,name:x.name,value:Number(x.value),approved:false,createdAt:serverTimestamp()})};window.removeWeek=id=>deleteDoc(doc(db,'weekJobs',id));
window.addLib=()=>addDoc(collection(db,'library'),{icon:$('ni').value||'⭐',name:$('nn').value.trim(),value:Number($('nv').value)||0});window.delLib=id=>deleteDoc(doc(db,'library',id));window.addResp=()=>addDoc(collection(db,'responsibilities'),{icon:$('ri').value||'⭐',name:$('rn').value.trim()});window.delResp=id=>deleteDoc(doc(db,'responsibilities',id));
window.goalSave=()=>updateDoc(doc(db,'app','state'),{goal:{name:$('gn').value.trim(),amount:Number($('ga').value)||0}});window.spend=async()=>{let a=Number($('sa').value),n=$('sn').value.trim();if(!a||!n)return;let b=writeBatch(db);b.update(doc(db,'app','state'),{balance:increment(-a)});b.set(doc(collection(db,'transactions')),{note:'Spent: '+n,amount:-a,createdAt:serverTimestamp()});await b.commit()};
window.newWeek=async()=>{if(!confirm("Start a new week? Weekly earnings reset; running balance stays."))return;let b=writeBatch(db);b.set(doc(collection(db,'history')),{label:'Week ending '+new Date().toLocaleDateString(),earned:Number(S.weekEarned||0),createdAt:serverTimestamp()});b.update(doc(db,'app','state'),{weekEarned:0});J.forEach(x=>b.delete(doc(db,'weekJobs',x.id)));Q.forEach(x=>b.delete(doc(db,'submissions',x.id)));await b.commit()}
</script></body></html>
