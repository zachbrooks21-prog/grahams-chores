<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><title>Graham's Chores V3</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033;margin:0}.w{max-width:820px;margin:auto;padding:18px 16px 90px}.card{background:#fff;border-radius:20px;padding:16px;margin:14px 0;box-shadow:0 6px 22px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat b{display:block;font-size:26px;color:#17844b}.job{display:flex;align-items:center;gap:10px;padding:13px 0;border-top:1px solid #e7e9ef}.job:first-child{border:0}.grow{flex:1}.btn{border:0;border-radius:13px;padding:10px 13px;font-weight:700;background:#202a44;color:#fff}.sec{background:#edf0f5;color:#202a44}.good{background:#17844b}.danger{background:#fde8e8;color:#982121}.hidden{display:none}.tabs{display:flex;gap:7px;overflow:auto}.tabs button{white-space:nowrap}input,select{width:100%;padding:11px;border:1px solid #d8dde6;border-radius:11px;box-sizing:border-box;margin:5px 0 10px}label{font-weight:700}.pill{font-size:12px;font-weight:700;background:#fff3d9;color:#805000;padding:7px 9px;border-radius:99px}.done{background:#e4f5eb;color:#126b3d}.small{color:#697386;font-size:13px}.login{max-width:460px;margin:50px auto}.row{display:flex;gap:8px;align-items:center}.money{color:#17844b;font-weight:800}@media(max-width:520px){.w{padding-top:8px}}</style></head><body><main class="w">
<section id="login" class="login"><div class="card"><h1>⭐ Graham's Chores V3</h1><p class="small">Sign in with your existing Firebase account.</p><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button class="btn" onclick="doLogin()">Sign In</button><p id="msg" class="small"></p></div></section>
<section id="kid" class="hidden"><h1>⭐ Graham's Day</h1><div class="grid"><div class="card stat">This Week<b id="kw">$0.00</b></div><div class="card stat">My Money<b id="kb">$0.00</b></div></div><div id="goal" class="card hidden"></div><div class="card"><h2>🏠 Today's Responsibilities</h2><p id="progress" class="money"></p><div id="resps"></div></div><div class="card"><h2 id="lockTitle">🔒 Money Jobs</h2><p id="lockMsg" class="small"></p><div id="jobs"></div></div><div class="card"><h2>⭐ My Streak</h2><p id="streak"></p></div><button class="btn sec" onclick="doLogout()">Sign Out</button></section>
<section id="parent" class="hidden"><h1>Parent Dashboard · V3</h1><p class="small">Manage Graham's daily routine and extra jobs.</p><div class="grid"><div class="card stat">This Week<b id="pw">$0.00</b></div><div class="card stat">Balance<b id="pb">$0.00</b></div></div><div class="tabs"><button class="btn" onclick="tab('ap')">Approvals</button><button class="btn sec" onclick="tab('day')">Daily</button><button class="btn sec" onclick="tab('wk')">Jobs</button><button class="btn sec" onclick="tab('lib')">Library</button><button class="btn sec" onclick="tab('mon')">Money</button><button class="btn sec" onclick="tab('hist')">History</button></div><div id="ap" class="card"></div><div id="day" class="card hidden"></div><div id="wk" class="card hidden"></div><div id="lib" class="card hidden"></div><div id="mon" class="card hidden"></div><div id="hist" class="card hidden"></div><button class="btn sec" onclick="doLogout()">Sign Out</button></section></main><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc,collection,addDoc,deleteDoc,onSnapshot,serverTimestamp,increment,writeBatch,runTransaction}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyD3oGLEWtFHhmuHirOL8jxjqhjYx-rcWMU",authDomain:"grahams-chores.firebaseapp.com",projectId:"grahams-chores",storageBucket:"grahams-chores.firebasestorage.app",messagingSenderId:"634924367252",appId:"1:634924367252:web:028a2463bfb3f7e529a381"},PARENT_UID="aDP5yAdPbpQ0QlSCjLNJW7AkV0t1";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);setPersistence(auth,browserLocalPersistence);
let user,S={balance:0,weekEarned:0,goal:{}},J=[],L=[],R=[],Q=[],H=[],T=[],D={},config={},busy=false;
const $=id=>document.getElementById(id),m=n=>'$'+Number(n||0).toFixed(2),today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},weekday=()=>new Date().getDay(),show=id=>['login','kid','parent'].forEach(x=>$(x).classList.toggle('hidden',x!==id)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defs=[['bed','🛏️','Make bed',[0,1,2,3,4,5,6],true],['teeth-am','🪥','Brush teeth — morning',[0,1,2,3,4,5,6],true],['kumon','📚','Complete Kumon',[0,1,2,3,4,5,6],true],['hamper','👕','Dirty clothes in hamper',[0,1,2,3,4,5,6],true],['dishes','🍽️','Clear own dishes',[0,1,2,3,4,5,6],true],['toys','🧸','Pick up toys',[0,1,2,3,4,5,6],true],['shoes','👟','Put shoes away',[0,1,2,3,4,5,6],true],['backpack','🎒','Put backpack/lunchbox away',[1,2,3,4,5],true],['teeth-pm','🪥','Brush teeth — night',[0,1,2,3,4,5,6],false]];
window.doLogin=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){$('msg').textContent='Sign-in failed. Check your email and password.'}};window.doLogout=()=>signOut(auth);
const configRef=doc(db,'app','v3config');
async function setup(){let d=await getDoc(configRef);if(!d.exists())await setDoc(configRef,{responsibilities:defs.map(([id,icon,name,days,required])=>({id,icon,name,days,required,active:true})),overrideDate:'',streak:0,lastCompletedDate:''});}
function listen(parent){onSnapshot(doc(db,'app','state'),d=>{if(d.exists())S=d.data();render(parent)});onSnapshot(configRef,d=>{if(d.exists())config=d.data();render(parent)});onSnapshot(doc(db,'dailyProgress',today()),d=>{D=d.exists()?d.data():{};render(parent)});for(let [name,key] of [['weekJobs','J'],['library','L'],['submissions','Q'],['history','H'],['transactions','T']])onSnapshot(collection(db,name),s=>{let v=s.docs.map(d=>({id:d.id,...d.data()}));if(key==='J')J=v;if(key==='L')L=v;if(key==='Q')Q=v;if(key==='H')H=v;if(key==='T')T=v;render(parent)})}
onAuthStateChanged(auth,async u=>{user=u;if(!u)return show('login');let parent=u.uid===PARENT_UID;show(parent?'parent':'kid');if(parent)await setup();listen(parent)});
function tasks(){return(config.responsibilities||[]).filter(x=>x.active&&x.days.includes(weekday()))}function complete(x){return D[x.id]===true}function unlocked(){return config.overrideDate===today()||tasks().filter(x=>x.required).every(complete)}
function render(p){if(!p)return renderKid();renderParent()}
function renderKid(){$('kw').textContent=m(S.weekEarned);$('kb').textContent=m(S.balance);$('goal').classList.toggle('hidden',!S.goal?.name);$('goal').textContent=S.goal?.name?'🎯 Saving for '+S.goal.name+' — '+m(S.balance)+' / '+m(S.goal.amount):'';let a=tasks(),req=a.filter(x=>x.required),done=req.filter(complete).length,open=unlocked();$('progress').textContent=`${done} of ${req.length} required complete`;$('resps').innerHTML=a.map(x=>`<div class="job"><span style="font-size:26px">${esc(x.icon)}</span><div class="grow"><b>${esc(x.name)}</b>${!x.required?'<div class="small">Evening / optional for unlock</div>':''}</div>${complete(x)?'<span class="pill done">Done ✓</span>':`<button class="btn sec" onclick="check('${x.id}')">DONE ✓</button>`}</div>`).join('')||'Nothing scheduled today.';$('lockTitle').textContent=open?'🔓 Money Jobs':'🔒 Money Jobs';$('lockMsg').textContent=open?'Great job! Your Money Jobs are unlocked.':'Finish today’s required responsibilities to unlock paid jobs.';$('jobs').innerHTML=J.map(x=>{let q=Q.find(y=>y.jobId===x.id&&y.type==='moneyJob');return `<div class="job"><div class="grow">${esc(x.icon)} <b>${esc(x.name)}</b><div class="money">${m(x.value)}</div></div>${x.approved?'<span class="pill done">Approved ✓</span>':q?'<span class="pill">Waiting 👍</span>':`<button class="btn good" ${open?'':'disabled'} onclick="submit('${x.id}')">DONE ✓</button>`}</div>`}).join('')||'No money jobs assigned.';$('streak').textContent=`${Number(config.streak||0)} completed days ⭐`}
window.check=async id=>{if(!tasks().some(x=>x.id===id))return;try{await setDoc(doc(db,'dailyProgress',today()),{[id]:true},{merge:true})}catch(e){alert('Could not save. Check your connection.')}};
window.submit=async id=>{if(!unlocked())return;let x=J.find(x=>x.id===id);if(!x||x.approved||Q.some(q=>q.jobId===id))return;await addDoc(collection(db,'submissions'),{jobId:id,jobName:x.name,value:Number(x.value),type:'moneyJob',submittedBy:user.uid,submittedAt:serverTimestamp()})};
function renderParent(){$('pw').textContent=m(S.weekEarned);$('pb').textContent=m(S.balance);$('ap').innerHTML='<h2>👍 Approvals</h2>'+(Q.map(x=>`<div class="job"><div class="grow"><b>${esc(x.jobName)}</b> ${m(x.value)}</div><button class="btn good" onclick="approve('${x.id}')">Approve</button><button class="btn danger" onclick="reject('${x.id}')">No</button></div>`).join('')||'Nothing waiting.');let a=tasks(),req=a.filter(x=>x.required);$('day').innerHTML=`<h2>🏠 Daily Responsibilities</h2><p>${req.filter(complete).length}/${req.length} required complete today</p><button class="btn sec" onclick="override()">${config.overrideDate===today()?'Remove today’s override':'Unlock Money Jobs today (override)'}</button><h3>Manage responsibilities</h3>${(config.responsibilities||[]).map(x=>`<div class="job"><div class="grow">${esc(x.icon)} <b>${esc(x.name)}</b><div class="small">${x.required?'Required to unlock':'Not required to unlock'} · ${x.days.length===7?'Every day':x.days.join(', ')}</div></div><button class="btn sec" onclick="editTask('${x.id}')">Edit</button></div>`).join('')}<h3>Add Responsibility</h3><input id="newTask" placeholder="Responsibility name"><input id="newEmoji" value="⭐" placeholder="Emoji"><button class="btn" onclick="addTask()">Add</button><h3>Daily streak</h3><p>${Number(config.streak||0)} days</p><button class="btn sec" onclick="finalizeDay()">Count today toward streak</button><p class="small">Count a day after all required responsibilities are completed. Count each day once.</p>`;
$('wk').innerHTML=`<h2>💰 Weekly Money Jobs</h2><select id="sel">${L.map(x=>`<option value="${x.id}">${esc(x.name)} — ${m(x.value)}</option>`).join('')}</select><button class="btn" onclick="addWeek()">Add from Library</button><h3>⭐ Quick Bonus Job</h3><input id="bonusName" placeholder="Bonus job name"><input id="bonusAmt" type="number" step=".25" min="0" value="1"><button class="btn" onclick="bonus()">Send Bonus Job</button>${J.map(x=>`<div class="job"><div class="grow">${esc(x.icon)} <b>${esc(x.name)}</b> ${m(x.value)} ${x.approved?'✓':''}</div><button class="btn danger" onclick="removeWeek('${x.id}')">Remove</button></div>`).join('')}<button class="btn sec" onclick="newWeek()">Start New Week</button>`;
$('lib').innerHTML=`<h2>🧰 Job Library</h2>${L.map(x=>`<div class="job"><div class="grow">${esc(x.icon)} ${esc(x.name)} ${m(x.value)}</div><button class="btn danger" onclick="delLib('${x.id}')">Delete</button></div>`).join('')}<input id="ni" value="⭐"><input id="nn" placeholder="Job name"><input id="nv" type="number" step=".25" value=".50"><button class="btn" onclick="addLib()">Save Job</button>`;
$('mon').innerHTML=`<h2>💵 Money</h2><label>Savings Goal</label><input id="gn" value="${esc(S.goal?.name||'')}"><input id="ga" type="number" value="${Number(S.goal?.amount||0)}"><button class="btn" onclick="goalSave()">Save Goal</button><h3>Spending</h3><input id="sn" placeholder="Purchase"><input id="sa" type="number" step=".01" placeholder="Amount"><button class="btn sec" onclick="spend()">Record Spending</button>`;
$('hist').innerHTML='<h2>📚 History</h2>'+H.map(x=>`<div class="job">${esc(x.label)} — ${m(x.earned)}</div>`).join('')+'<h3>Money Activity</h3>'+T.map(x=>`<div class="job">${esc(x.note)} — ${m(x.amount)}</div>`).join('')}
window.tab=n=>['ap','day','wk','lib','mon','hist'].forEach(x=>$(x).classList.toggle('hidden',x!==n));
window.override=()=>updateDoc(configRef,{overrideDate:config.overrideDate===today()?'':today()});
window.editTask=async id=>{let x=config.responsibilities.find(x=>x.id===id),name=prompt('Responsibility name',x.name);if(name===null||!name.trim())return;let days=prompt('Days: 0=Sunday, 1=Monday ... 6=Saturday (comma-separated)',x.days.join(','));if(days===null)return;let parsed=[...new Set(days.split(',').map(Number))].filter(n=>Number.isInteger(n)&&n>=0&&n<=6);if(!parsed.length)return alert('Choose at least one valid day.');let required=confirm('Require this responsibility to unlock Money Jobs? OK = Yes; Cancel = No');let active=confirm('Keep this responsibility active? OK = Yes; Cancel = No');await updateDoc(configRef,{responsibilities:config.responsibilities.map(y=>y.id===id?{...y,name:name.trim(),days:parsed,required,active}:y)})};
window.addTask=async()=>{let name=$('newTask').value.trim();if(!name)return;let a=[...(config.responsibilities||[]),{id:'custom-'+Date.now(),icon:$('newEmoji').value||'⭐',name,days:[0,1,2,3,4,5,6],required:true,active:true}];await updateDoc(configRef,{responsibilities:a})};
window.finalizeDay=async()=>{if(!tasks().filter(x=>x.required).every(complete))return alert('Finish required responsibilities first.');if(config.lastCompletedDate===today())return alert('Already counted today.');let yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);let key=yesterday.getFullYear()+'-'+String(yesterday.getMonth()+1).padStart(2,'0')+'-'+String(yesterday.getDate()).padStart(2,'0');await updateDoc(configRef,{streak:config.lastCompletedDate===key?Number(config.streak||0)+1:1,lastCompletedDate:today()})};
window.approve=async id=>{let x=Q.find(x=>x.id===id);if(!x)return;let job=J.find(j=>j.id===x.jobId);if(!job||job.approved)return alert('Job already approved or no longer exists.');let b=writeBatch(db);b.update(doc(db,'weekJobs',x.jobId),{approved:true});b.update(doc(db,'app','state'),{weekEarned:increment(Number(job.value)),balance:increment(Number(job.value))});b.set(doc(collection(db,'transactions')),{note:'Earned: '+job.name,amount:Number(job.value),createdAt:serverTimestamp()});b.delete(doc(db,'submissions',id));await b.commit()};window.reject=id=>deleteDoc(doc(db,'submissions',id));
window.addWeek=async()=>{let x=L.find(x=>x.id===$('sel').value);if(x)await addDoc(collection(db,'weekJobs'),{icon:x.icon,name:x.name,value:Number(x.value),approved:false,createdAt:serverTimestamp()})};window.bonus=async()=>{let name=$('bonusName').value.trim(),value=Number($('bonusAmt').value);if(!name||!Number.isFinite(value)||value<0)return;await addDoc(collection(db,'weekJobs'),{icon:'⭐',name,value,approved:false,bonus:true,createdAt:serverTimestamp()})};window.removeWeek=id=>deleteDoc(doc(db,'weekJobs',id));window.addLib=async()=>{let name=$('nn').value.trim(),value=Number($('nv').value);if(name&&Number.isFinite(value)&&value>=0)await addDoc(collection(db,'library'),{icon:$('ni').value||'⭐',name,value})};window.delLib=id=>deleteDoc(doc(db,'library',id));window.goalSave=()=>updateDoc(doc(db,'app','state'),{goal:{name:$('gn').value.trim(),amount:Number($('ga').value)||0}});window.spend=async()=>{let n=$('sn').value.trim(),a=Number($('sa').value);if(!n||!Number.isFinite(a)||a<=0)return;let b=writeBatch(db);b.update(doc(db,'app','state'),{balance:increment(-a)});b.set(doc(collection(db,'transactions')),{note:'Spent: '+n,amount:-a,createdAt:serverTimestamp()});await b.commit()};window.newWeek=async()=>{if(!confirm('Archive this week and reset weekly earnings? Running balance stays.'))return;let b=writeBatch(db);b.set(doc(collection(db,'history')),{label:'Week ending '+new Date().toLocaleDateString(),earned:Number(S.weekEarned||0),createdAt:serverTimestamp()});b.update(doc(db,'app','state'),{weekEarned:0});J.forEach(x=>b.delete(doc(db,'weekJobs',x.id)));Q.forEach(x=>b.delete(doc(db,'submissions',x.id)));await b.commit()};
</script></body></html>
